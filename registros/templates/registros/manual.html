{% extends "registros/base.html" %}
{% load static %}

{% block title %}Manual de Usuario - Planilla Rural{% endblock %}

{% block extra_head %}
  <style>
    body {
      background:
        radial-gradient(circle at 10% 5%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 95%, rgba(217, 119, 6, 0.06) 0%, transparent 40%),
        linear-gradient(180deg, #faf9f6 0%, #f1efe9 100%);
      scroll-behavior: smooth;
    }

    /* Estilos del cuerpo del manual parseado */
    #manual-body {
      color: #334155; /* slate-700 */
      font-size: 1rem;
      line-height: 1.75;
    }
    #manual-body h1 {
      font-size: 2.25rem;
      font-weight: 900;
      color: #0f1f1b; /* dark green */
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid rgba(16, 185, 129, 0.2);
      padding-bottom: 0.75rem;
      line-height: 1.2;
    }
    #manual-body h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f2d24; /* deep green */
      margin-top: 2.5rem;
      margin-bottom: 1.25rem;
      scroll-margin-top: 130px; /* offset for sticky header */
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding-bottom: 0.5rem;
    }
    #manual-body h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #15803d; /* emerald-700 */
      margin-top: 1.75rem;
      margin-bottom: 1rem;
      scroll-margin-top: 130px;
    }
    #manual-body p {
      margin-top: 0;
      margin-bottom: 1.25rem;
    }
    #manual-body ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin-bottom: 1.25rem;
    }
    #manual-body ol {
      list-style-type: decimal;
      padding-left: 1.5rem;
      margin-bottom: 1.25rem;
    }
    #manual-body li {
      margin-bottom: 0.5rem;
    }
    #manual-body strong {
      font-weight: 700;
      color: #0f172a;
    }
    #manual-body blockquote {
      border-left: 4px solid #10b981;
      background-color: rgba(209, 250, 229, 0.4);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      border-radius: 0 0.75rem 0.75rem 0;
      font-style: italic;
      color: #1e293b;
    }
    #manual-body blockquote strong {
      color: #064e3b;
    }
    #manual-body img {
      max-width: 100%;
      height: auto;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.06), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(16, 185, 129, 0.15);
      margin: 2rem auto;
      display: block;
      cursor: zoom-in;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #manual-body img:hover {
      transform: scale(1.005);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
    }
    #manual-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.75rem 0;
      font-size: 0.95rem;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.1);
    }
    #manual-body th {
      background-color: #134e4a; /* teal-900 */
      color: #ffffff;
      font-weight: 600;
      text-align: left;
      padding: 0.75rem 1rem;
    }
    #manual-body td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      background-color: #ffffff;
    }
    #manual-body tr:last-child td {
      border-bottom: none;
    }
    #manual-body tr:hover td {
      background-color: #f8fafc;
    }
    #manual-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background-color: #e2e8f0;
      color: #0f172a;
      padding: 0.2rem 0.4rem;
      border-radius: 0.375rem;
      font-size: 0.85em;
      font-weight: 600;
    }
    #manual-body hr {
      border: 0;
      border-top: 1px solid rgba(16, 185, 129, 0.2);
      margin: 2.5rem 0;
    }

    /* Animación de fade para el modal */
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Sobreescritura para Modo Escritorio Forzado */
    body.desktop-view-forced aside {
      display: block !important;
    }
    body.desktop-view-forced main {
      max-width: 80rem !important; /* max-w-7xl */
    }
    body.desktop-view-forced .sticky.top-\[73px\] {
      display: none !important;
    }

    /* Sobreescritura para Modo Móvil Forzado */
    body.mobile-view-forced aside {
      display: none !important;
    }
    body.mobile-view-forced main {
      max-width: 36rem !important; /* max-w-xl */
      margin-left: auto !important;
      margin-right: auto !important;
    }
    body.mobile-view-forced .sticky.top-\[73px\] {
      display: flex !important;
    }
  </style>
{% endblock %}

{% block content %}
  <!-- Header Principal Sticky -->
  <header class="sticky top-0 z-30 w-full border-b border-emerald-900/10 bg-white/80 py-4 shadow-sm backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 sm:px-6">
      <div class="flex items-center gap-3">
        <a href="{% url 'login' %}" class="flex h-10 w-10 items-center justify-center rounded-xl border border-emerald-900/10 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <div>
          <span class="text-[10px] font-extrabold uppercase tracking-widest text-emerald-700">Documentación oficial</span>
          <h1 class="text-lg font-black leading-none text-slate-900 sm:text-xl">Manual de Usuario</h1>
        </div>
      </div>

      <!-- Barra de Búsqueda -->
      <div class="relative flex items-center gap-1">
        <div class="relative max-w-xs sm:max-w-sm">
          <input
            id="search-input"
            type="text"
            placeholder="Buscar texto..."
            class="w-40 rounded-xl border border-emerald-900/15 bg-white px-3 py-1.5 pl-8 text-xs shadow-sm outline-none transition-all focus:w-48 sm:w-56 sm:text-sm sm:focus:w-64"
          />
          <svg class="absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <!-- Controles de búsqueda -->
        <div class="hidden items-center gap-1 sm:flex">
          <span id="match-count" class="text-xs font-bold text-slate-500 min-w-[50px] text-center"></span>
          <button id="prev-match" disabled class="rounded-lg border border-slate-200 bg-white p-1.5 text-slate-500 hover:bg-slate-50 disabled:opacity-40 transition-colors">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
            </svg>
          </button>
          <button id="next-match" disabled class="rounded-lg border border-slate-200 bg-white p-1.5 text-slate-500 hover:bg-slate-50 disabled:opacity-40 transition-colors">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>

        <!-- Botón Toggle Vista Escritorio/Móvil -->
        <button id="toggleDesktopViewBtn" type="button" title="Modo escritorio"
          class="inline-flex items-center justify-center rounded-xl border border-emerald-900/10 bg-emerald-50 text-emerald-800 h-8 w-8 hover:bg-emerald-100 transition-all hover:scale-105 active:scale-95 duration-200 shrink-0">
          <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span class="sr-only">Modo escritorio</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sub-Header para Móvil (Controles de TOC flotante) -->
  <div class="sticky top-[73px] z-20 flex w-full items-center justify-between border-b border-slate-100 bg-slate-50 px-4 py-2 md:hidden">
    <button id="mobile-toc-toggle" class="flex items-center gap-1.5 rounded-xl border border-emerald-900/10 bg-emerald-50/70 px-3 py-1.5 text-xs font-bold text-emerald-800 hover:bg-emerald-100/80 transition-colors">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span>Contenidos</span>
    </button>
    <div class="flex items-center gap-1 sm:hidden">
      <span id="mobile-match-count" class="text-xs font-bold text-slate-500"></span>
    </div>
  </div>

  <!-- Contenedor Principal de Dos Columnas -->
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    <div class="flex gap-8">
      <!-- Columna Izquierda: Tabla de Contenidos (Sidebar) - Desktop -->
      <aside class="hidden w-64 shrink-0 md:block">
        <div class="sticky top-[100px] max-h-[calc(100vh-140px)] overflow-y-auto rounded-2xl border border-emerald-900/5 bg-white/70 p-4 shadow-sm backdrop-blur">
          <p class="mb-3 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Contenidos</p>
          <ul id="toc-list" class="space-y-1">
            <!-- Cargado dinámicamente con JS -->
          </ul>
        </div>
      </aside>

      <!-- Columna Derecha: Contenido del Manual -->
      <section class="min-w-0 flex-1">
        <article class="rounded-3xl border border-white bg-white/80 p-6 shadow-md backdrop-blur sm:p-8 md:p-10">
          <div id="manual-body">
            <!-- El contenido HTML renderizado por marked aparecerá aquí -->
          </div>
        </article>
      </section>
    </div>
  </main>

  <!-- Drawer de TOC para Móviles -->
  <div id="mobile-toc-drawer" class="fixed inset-0 z-40 hidden transition-opacity duration-300">
    <div id="mobile-toc-backdrop" class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
    <div id="mobile-toc-content" class="absolute bottom-0 left-0 right-0 max-h-[75vh] translate-y-full rounded-t-[2.5rem] bg-white p-6 shadow-2xl transition-transform duration-300 overflow-y-auto">
      <div class="flex items-center justify-between border-b pb-3 mb-4">
        <h3 class="text-lg font-extrabold text-slate-800">Contenidos</h3>
        <button id="close-mobile-toc" class="rounded-full bg-slate-100 p-1.5 text-slate-500 hover:bg-slate-200 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <ul id="mobile-toc-list" class="space-y-1 pb-6">
        <!-- Cargado dinámicamente con JS -->
      </ul>
    </div>
  </div>

  <!-- Visor de Imágenes en Pantalla Completa (Modal) -->
  <div id="image-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/95 p-4 transition-all duration-300 backdrop-blur-md opacity-0">
    <button id="close-modal" class="absolute right-4 top-4 rounded-full bg-white/10 p-2.5 text-white hover:bg-white/20 transition-colors focus:outline-none">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="relative max-h-[85vh] max-w-[95vw] overflow-hidden rounded-2xl bg-white shadow-2xl flex flex-col justify-center items-center p-2">
      <img id="modal-img" src="" alt="Ampliado" class="max-h-[75vh] max-w-full rounded-lg object-contain transition-transform duration-200 cursor-grab active:cursor-grabbing">
      <div id="modal-caption" class="mt-2 text-center text-xs font-semibold text-slate-500 py-1 px-4 max-w-lg truncate"></div>
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-3 rounded-full bg-slate-950/80 px-4 py-2 text-white shadow-lg backdrop-blur">
        <button id="zoom-out" class="p-1 hover:text-emerald-400 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
          </svg>
        </button>
        <span id="zoom-level" class="text-xs font-black w-12 text-center select-none">100%</span>
        <button id="zoom-in" class="p-1 hover:text-emerald-400 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
        <button id="zoom-reset" class="ml-2 border-l border-white/20 pl-2 text-xs font-bold hover:text-emerald-400 transition-colors">Reset</button>
      </div>
    </div>
  </div>

  <!-- Contenido Markdown Crudo (Leído de forma segura por JS) -->
  <script type="text/markdown" id="markdown-content">
{{ content|safe }}
  </script>
{% endblock %}

{% block scripts %}
  <script src="{% static 'registros/js/marked.min.js' %}"></script>
  <script>
    // Fallback de CDN si falla la carga local
    if (typeof marked === 'undefined') {
      console.warn("marked.min.js no se cargó localmente. Intentando cargar desde CDN...");
      document.write('<script src="https://cdn.jsdelivr.net/npm/marked/dist/marked.min.js"><\/script>');
    }
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Renderizar Markdown con marked.js
      const rawMarkdown = document.getElementById("markdown-content").textContent;
      const manualBody = document.getElementById("manual-body");
      
      const renderManual = () => {
        if (rawMarkdown && typeof marked !== 'undefined') {
          manualBody.innerHTML = marked.parse(rawMarkdown);
          setupInteractivity();
        } else {
          manualBody.innerHTML = `
            <div class="rounded-2xl border border-red-200 bg-red-50 p-6 text-center text-red-800 shadow-sm max-w-lg mx-auto my-12">
              <svg class="mx-auto h-12 w-12 text-red-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <h3 class="text-base font-extrabold mb-1">Error al inicializar el manual</h3>
              <p class="text-xs text-red-700/80 mb-4">No se pudo cargar el parseador de Markdown (marked.min.js). Si estás administrando el sitio, asegurate de correr <code>python manage.py collectstatic</code> en el servidor y recargar la aplicación.</p>
              <button onclick="window.location.reload()" class="rounded-xl bg-red-600 px-4 py-2 text-xs font-bold text-white shadow hover:bg-red-700 transition-colors">Reintentar</button>
            </div>
          `;
        }
      };

      if (typeof marked !== 'undefined') {
        renderManual();
      } else {
        setTimeout(renderManual, 200);
      }

      function setupInteractivity() {
        // 2. Construir Tabla de Contenidos (TOC) Dinámica
        const headings = manualBody.querySelectorAll("h2, h3");
        const tocList = document.getElementById("toc-list");
        const mobileTocList = document.getElementById("mobile-toc-list");

        headings.forEach((heading, index) => {
          // Generar un ID único amigable si no existe
          if (!heading.id) {
            const cleanText = heading.textContent
              .toLowerCase()
              .trim()
              .replace(/[^\w\s-]/g, "")
              .replace(/[\s_]+/g, "-");
            heading.id = `sec-${cleanText || index}`;
          }

          // Crear elementos de enlace para desktop y móvil
          const liDesktop = document.createElement("li");
          const aDesktop = document.createElement("a");
          aDesktop.href = `#${heading.id}`;
          aDesktop.textContent = heading.textContent;

          const liMobile = document.createElement("li");
          const aMobile = document.createElement("a");
          aMobile.href = `#${heading.id}`;
          aMobile.textContent = heading.textContent;

          // Estilos según el nivel de título
          if (heading.tagName.toLowerCase() === "h2") {
            aDesktop.className = "block py-1.5 px-3 text-sm font-semibold text-slate-700 hover:text-emerald-800 rounded-xl hover:bg-emerald-50/70 transition-all border-l-2 border-transparent hover:border-emerald-500";
            liDesktop.className = "mt-2";

            aMobile.className = "block py-2.5 px-4 text-sm font-bold text-slate-700 hover:text-emerald-800 rounded-2xl hover:bg-emerald-50 transition-all";
            liMobile.className = "mt-2";
          } else {
            aDesktop.className = "block py-1 px-3 pl-6 text-xs text-slate-500 hover:text-emerald-800 rounded-lg hover:bg-emerald-50/50 transition-all border-l border-transparent hover:border-emerald-500/50";
            liDesktop.className = "mt-0.5";

            aMobile.className = "block py-1.5 px-4 pl-8 text-xs font-semibold text-slate-500 hover:text-emerald-800 rounded-xl hover:bg-emerald-50/50 transition-all";
            liMobile.className = "mt-0.5";
          }

          liDesktop.appendChild(aDesktop);
          tocList.appendChild(liDesktop);

          liMobile.appendChild(aMobile);
          mobileTocList.appendChild(liMobile);

          // Click handler para cerrar el drawer móvil tras clickear sección
          aMobile.addEventListener("click", () => {
            closeMobileTocDrawer();
          });
        });

        // 3. ScrollSpy con IntersectionObserver
        const observerOptions = {
          root: null,
          rootMargin: "0px 0px -70% 0px",
          threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const id = entry.target.id;
              
              // Remover estilos activos en ambos menús
              document.querySelectorAll("#toc-list a").forEach((a) => {
                a.classList.remove("text-emerald-800", "bg-emerald-50/70", "border-emerald-500", "font-bold");
              });
              document.querySelectorAll("#mobile-toc-list a").forEach((a) => {
                a.classList.remove("text-emerald-800", "bg-emerald-50", "font-bold");
              });

              // Resaltar en Desktop
              const activeDesktop = document.querySelector(`#toc-list a[href="#${id}"]`);
              if (activeDesktop) {
                activeDesktop.classList.add("text-emerald-800", "bg-emerald-50/70", "border-emerald-500", "font-bold");
              }

              // Resaltar en Móvil
              const activeMobile = document.querySelector(`#mobile-toc-list a[href="#${id}"]`);
              if (activeMobile) {
                activeMobile.classList.add("text-emerald-800", "bg-emerald-50", "font-bold");
              }
            }
          });
        }, observerOptions);

        headings.forEach((heading) => observer.observe(heading));

        // 4. Modal Visor de Imágenes
        const modal = document.getElementById("image-modal");
        const modalImg = document.getElementById("modal-img");
        const modalCaption = document.getElementById("modal-caption");
        const closeModalBtn = document.getElementById("close-modal");
        const zoomInBtn = document.getElementById("zoom-in");
        const zoomOutBtn = document.getElementById("zoom-out");
        const zoomResetBtn = document.getElementById("zoom-reset");
        const zoomLevelSpan = document.getElementById("zoom-level");

        let scale = 1;
        let isDragging = false;
        let startX = 0, startY = 0;
        let translateX = 0, translateY = 0;

        manualBody.addEventListener("click", (e) => {
          if (e.target.tagName.toLowerCase() === "img") {
            modalImg.src = e.target.src;
            modalCaption.textContent = e.target.alt;
            
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();

            modal.classList.remove("hidden");
            setTimeout(() => {
              modal.classList.remove("opacity-0");
              modal.classList.add("opacity-100");
            }, 10);
          }
        });

        function updateTransform() {
          modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
          zoomLevelSpan.textContent = `${Math.round(scale * 100)}%`;
        }

        function closeModal() {
          modal.classList.remove("opacity-100");
          modal.classList.add("opacity-0");
          setTimeout(() => {
            modal.classList.add("hidden");
          }, 300);
        }

        closeModalBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal || e.target.id === "close-modal") {
            closeModal();
          }
        });

        zoomInBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          scale = Math.min(scale + 0.25, 4);
          updateTransform();
        });

        zoomOutBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          scale = Math.max(scale - 0.25, 0.5);
          updateTransform();
        });

        zoomResetBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          scale = 1;
          translateX = 0;
          translateY = 0;
          updateTransform();
        });

        modalImg.addEventListener("mousedown", (e) => {
          e.preventDefault();
          if (scale <= 1) return;
          isDragging = true;
          startX = e.clientX - translateX;
          startY = e.clientY - translateY;
          modalImg.style.transition = "none";
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDragging) return;
          translateX = e.clientX - startX;
          translateY = e.clientY - startY;
          updateTransform();
        });

        window.addEventListener("mouseup", () => {
          if (isDragging) {
            isDragging = false;
            modalImg.style.transition = "transform 0.2s ease";
          }
        });

        // 5. Drawer de TOC para Móviles
        const mobileTocDrawer = document.getElementById("mobile-toc-drawer");
        const mobileTocContent = document.getElementById("mobile-toc-content");
        const mobileTocToggle = document.getElementById("mobile-toc-toggle");
        const closeMobileTocBtn = document.getElementById("close-mobile-toc");
        const mobileTocBackdrop = document.getElementById("mobile-toc-backdrop");

        function openMobileTocDrawer() {
          mobileTocDrawer.classList.remove("hidden");
          setTimeout(() => {
            mobileTocDrawer.classList.add("opacity-100");
            mobileTocContent.classList.remove("translate-y-full");
          }, 10);
        }

        function closeMobileTocDrawer() {
          mobileTocContent.classList.add("translate-y-full");
          mobileTocDrawer.classList.remove("opacity-100");
          setTimeout(() => {
            mobileTocDrawer.classList.add("hidden");
          }, 300);
        }

        mobileTocToggle.addEventListener("click", openMobileTocDrawer);
        closeMobileTocBtn.addEventListener("click", closeMobileTocDrawer);
        mobileTocBackdrop.addEventListener("click", closeMobileTocDrawer);

        // 6. Buscador con Resaltador
        const searchInput = document.getElementById("search-input");
        const matchCountSpan = document.getElementById("match-count");
        const mobileMatchCountSpan = document.getElementById("mobile-match-count");
        const prevMatchBtn = document.getElementById("prev-match");
        const nextMatchBtn = document.getElementById("next-match");
        
        let searchMatches = [];
        let currentMatchIndex = -1;

        function performSearch() {
          const query = searchInput.value.trim().toLowerCase();
          
          removeHighlights();
          searchMatches = [];
          currentMatchIndex = -1;

          if (!query) {
            matchCountSpan.textContent = "";
            mobileMatchCountSpan.textContent = "";
            prevMatchBtn.disabled = true;
            nextMatchBtn.disabled = true;
            return;
          }

          highlightText(manualBody, query);
          searchMatches = Array.from(document.querySelectorAll("mark.search-highlight"));

          if (searchMatches.length > 0) {
            currentMatchIndex = 0;
            prevMatchBtn.disabled = false;
            nextMatchBtn.disabled = false;
            const statusText = `1 de ${searchMatches.length}`;
            matchCountSpan.textContent = statusText;
            mobileMatchCountSpan.textContent = statusText;
            scrollToMatch(0);
          } else {
            const noResultsText = "Sin resultados";
            matchCountSpan.textContent = noResultsText;
            mobileMatchCountSpan.textContent = noResultsText;
            prevMatchBtn.disabled = true;
            nextMatchBtn.disabled = true;
          }
        }

        function removeHighlights() {
          const highlights = document.querySelectorAll("mark.search-highlight");
          highlights.forEach((highlight) => {
            const parent = highlight.parentNode;
            if (parent) {
              parent.replaceChild(document.createTextNode(highlight.textContent), highlight);
              parent.normalize();
            }
          });
        }

        function highlightText(element, query) {
          if (element.nodeType === 3) {
            const text = element.textContent;
            const lowerText = text.toLowerCase();
            let index = lowerText.indexOf(query);

            if (index >= 0) {
              const parent = element.parentNode;
              if (parent && parent.toggleAttribute && parent.tagName !== "SCRIPT" && parent.tagName !== "STYLE" && parent.tagName !== "MARK") {
                const fragment = document.createDocumentFragment();
                let lastIndex = 0;

                while (index >= 0) {
                  fragment.appendChild(document.createTextNode(text.substring(lastIndex, index)));

                  const mark = document.createElement("mark");
                  mark.className = "search-highlight bg-amber-200 text-slate-900 rounded-sm px-0.5";
                  mark.textContent = text.substring(index, index + query.length);
                  fragment.appendChild(mark);

                  lastIndex = index + query.length;
                  index = lowerText.indexOf(query, lastIndex);
                }

                fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                parent.replaceChild(fragment, element);
              }
            }
          } else if (element.nodeType === 1 && element.childNodes.length > 0) {
            for (let i = element.childNodes.length - 1; i >= 0; i--) {
              highlightText(element.childNodes[i], query);
            }
          }
        }

        function scrollToMatch(index) {
          if (index < 0 || index >= searchMatches.length) return;

          searchMatches.forEach((m) => m.classList.remove("bg-amber-400", "ring-2", "ring-amber-500"));

          const activeMatch = searchMatches[index];
          activeMatch.classList.add("bg-amber-400", "ring-2", "ring-amber-500");
          activeMatch.scrollIntoView({ behavior: "smooth", block: "center" });

          const statusText = `${index + 1} de ${searchMatches.length}`;
          matchCountSpan.textContent = statusText;
          mobileMatchCountSpan.textContent = statusText;
        }

        searchInput.addEventListener("input", performSearch);

        prevMatchBtn.addEventListener("click", () => {
          if (searchMatches.length === 0) return;
          currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
          scrollToMatch(currentMatchIndex);
        });

        nextMatchBtn.addEventListener("click", () => {
          if (searchMatches.length === 0) return;
          currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
          scrollToMatch(currentMatchIndex);
        });

        // 7. Alternar Vista Escritorio/Móvil
        const toggleDesktopViewBtn = document.getElementById("toggleDesktopViewBtn");
        let desktopViewEnabled = localStorage.getItem("planillaDesktopView") === "1";

        function applyDesktopView(enabled) {
          desktopViewEnabled = enabled;
          localStorage.setItem("planillaDesktopView", enabled ? "1" : "0");
          
          if (enabled) {
            document.body.classList.add("desktop-view-forced");
            document.body.classList.remove("mobile-view-forced");
            
            toggleDesktopViewBtn.title = "Modo móvil";
            toggleDesktopViewBtn.querySelector("span").textContent = "Modo móvil";
            toggleDesktopViewBtn.classList.add("bg-emerald-600", "text-white", "hover:bg-emerald-700");
            toggleDesktopViewBtn.classList.remove("bg-emerald-50", "text-emerald-800", "hover:bg-emerald-100");
          } else {
            document.body.classList.remove("desktop-view-forced");
            document.body.classList.add("mobile-view-forced");
            
            toggleDesktopViewBtn.title = "Modo escritorio";
            toggleDesktopViewBtn.querySelector("span").textContent = "Modo escritorio";
            toggleDesktopViewBtn.classList.remove("bg-emerald-600", "text-white", "hover:bg-emerald-700");
            toggleDesktopViewBtn.classList.add("bg-emerald-50", "text-emerald-800", "hover:bg-emerald-100");
          }
        }

        toggleDesktopViewBtn.addEventListener("click", () => {
          applyDesktopView(!desktopViewEnabled);
        });

        // Aplicar estado inicial
        applyDesktopView(desktopViewEnabled);
      }
    });
  </script>
{% endblock %}
